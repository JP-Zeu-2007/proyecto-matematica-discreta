  <!-- SCRIPT DE ALTERNANCIA DE VISTAS -->
  <script>
    function toggleVista(vista) {
      const vistaApp = document.getElementById('vista-app');
      const vistaAyuda = document.getElementById('vista-ayuda');

      if (vista === 'ayuda') {
        vistaApp.classList.add('hidden');
        vistaAyuda.classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else if (vista === 'app') {
        vistaAyuda.classList.add('hidden');
        vistaApp.classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    // Navegación suave dentro del panel de ayuda
    document.querySelectorAll('#vista-ayuda a[href^="#"]').forEach(ancla => {
      ancla.addEventListener('click', function (e) {
        const objetivo = document.querySelector(this.getAttribute('href'));
        if (objetivo) {
          e.preventDefault();
          objetivo.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      });
    });
  </script>

</body>
</html>
