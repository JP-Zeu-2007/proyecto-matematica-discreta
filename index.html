<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Módulo de Hamilton - Integrante 2</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: {
      umgNavy: '#002B49', umgGold: '#D4AF37', umgLightNavy: '#003A63', umgDarkNavy: '#001A2D',
    }}}}
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #F1F5F9; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
    .graph-container { height: 420px; width: 100%; border-radius: 0.75rem; border: 1px solid #E2E8F0; background-color: #F8FAFC; position: relative; overflow: hidden; }
    .graph-canvas-wrap { position: relative; width: 100%; height: 100%; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

  <header class="bg-umgNavy text-white shadow-xl border-b-4 border-umgGold sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <img src="logo.png" alt="Logo UMG" class="w-10 h-10 rounded-full object-contain bg-white p-1 shadow">
        <div>
          <h1 class="font-bold text-lg leading-tight">Módulo de Hamilton (Integrante 2)</h1>
          <p class="text-xs text-amber-300 font-medium">Luis Omar Pérez Hernández</p>
        </div>
      </div>
    </div>
  </header>

  <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
    
    <!-- PANEL IZQUIERDO (Grafo) -->
    <section class="lg:col-span-7 space-y-4">
      <div class="bg-white rounded-2xl shadow-md border border-slate-200 p-5 space-y-4">
        <h2 class="text-lg font-bold text-umgNavy border-b pb-2"><i class="fa-solid fa-pen-to-square text-umgGold mr-2"></i>Entrada de Vértices</h2>
        <div class="flex gap-2">
          <input type="text" id="new-vertex-name" placeholder="Ej. A, B, C o A B C" maxlength="50" class="flex-1 text-sm p-2 border border-slate-300 rounded-lg outline-none">
          <!-- ÚNICO BOTÓN DE AGREGAR -->
          <button onclick="addVertex(); return false;" class="px-4 py-2 bg-umgNavy text-white font-bold text-sm rounded-lg hover:bg-umgLightNavy transition"><i class="fa-solid fa-plus mr-1"></i> Agregar Vértices</button>
        </div>
        <div id="vertex-list" class="space-y-3 max-h-[250px] overflow-y-auto pr-1 custom-scrollbar"></div>
      </div>

      <div class="bg-white rounded-2xl shadow-md border border-slate-200 p-3">
        <h3 class="text-xs font-bold text-umgNavy mb-2 px-2">Visualización del Grafo</h3>
        <div class="graph-container">
          <div id="graph-canvas" class="graph-canvas-wrap"></div>
        </div>
      </div>
    </section>

    <aside class="lg:col-span-5 space-y-4">
      <div class="bg-white rounded-2xl shadow-md border border-slate-200 p-5">
        <h3 class="text-base font-bold text-umgNavy mb-3 border-b pb-2"><i class="fa-solid fa-microchip text-umgGold mr-1"></i> Análisis de Hamilton</h3>
        
        <div class="space-y-2">
          <button onclick="buscarCaminoHamilton()" class="w-full py-2.5 bg-emerald-500 text-white font-bold text-sm rounded-xl shadow hover:bg-emerald-600 transition flex items-center justify-center">
            <i class="fa-solid fa-route mr-2"></i> Buscar Camino de Hamilton
          </button>
          
          <button onclick="buscarCicloHamilton()" class="w-full py-2.5 bg-teal-600 text-white font-bold text-sm rounded-xl shadow hover:bg-teal-700 transition flex items-center justify-center">
            <i class="fa-solid fa-arrows-spin mr-2"></i> Buscar Ciclo de Hamilton
          </button>
          
          <button onclick="limpiar()" class="w-full py-1.5 bg-slate-200 text-slate-700 font-bold text-xs rounded-lg hover:bg-slate-300 transition mt-2">
            <i class="fa-solid fa-broom mr-1"></i> Limpiar Análisis
          </button>
        </div>
        
        <div id="result-hamilton" class="mt-4 text-xs p-3 rounded-lg border text-left font-sans leading-relaxed bg-slate-50 border-slate-200 text-slate-500">
          <i class="fa-solid fa-arrow-up mr-1"></i> Haz clic en un botón para iniciar el análisis del grafo.
        </div>
      </div>
    </aside>
  </main>

  <script>
    let vertices = []; let edges = []; let isDirected = false;
    let network = null; let isAnimating = false;

    function generateUniqueCode() {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'; let code, attempts = 0;
      do { code = '#'; for (let i = 0; i < 4; i++) code += chars.charAt(Math.floor(Math.random() * chars.length)); attempts++; }
      while (vertices.some(v => v.code === code) && attempts < 500);
      return code;
    }
    function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }
    function computeGrade(name) { return edges.filter(e => e.a === name || e.b === name).length; }

    function addVertex() {
      const input = document.getElementById('new-vertex-name'); 
      let texto = input.value.trim();
      if (!texto) return;

      let textoLimpio = texto.replace(/[^a-zA-Z0-9]/g, ' ');
      
      let nombres = textoLimpio.split(/\s+/).filter(n => n.length > 0);
      
      nombres = nombres.map(n => n.toUpperCase());

      let agregados = 0;
      let repetidos = 0;

      nombres.forEach(name => {
        if (!vertices.find(v => v.name === name)) {
          vertices.push({ name, code: generateUniqueCode() });
          agregados++;
        } else {
          repetidos++;
        }
      });

      input.value = '';
      
      if (agregados > 0) {
        render();
      } 
      if (repetidos > 0 && agregados === 0) {
        document.getElementById('result-hamilton').innerHTML = "⚠️ Los vértices que intentaste agregar ya existen.";
      }
    }

    function removeVertex(name) {
      edges = edges.filter(e => e.a !== name && e.b !== name);
      vertices = vertices.filter(x => x.name !== name); render();
    }
    
    function addEdge(a, b) {
      if (a === b || edges.some(e => (e.a === a && e.b === b) || (e.a === b && e.b === a))) return;
      edges.push({ a, b }); render();
    }
    
    function removeEdge(a,b) { edges = edges.filter(e => !((e.a === a && e.b === b) || (e.a === b && e.b === a))); render(); }

    function render() {
      const container = document.getElementById('vertex-list'); container.innerHTML = '';
      
      vertices.forEach(v => {
        const conns = edges.filter(e => e.a === v.name || e.b === v.name).map(e => e.a === v.name ? e.b : e.a);
        const disponibles = vertices.filter(x => x.name !== v.name && !conns.includes(x.name));

        const row = document.createElement('div'); row.className = 'bg-slate-50 border border-slate-200 rounded-xl p-3 space-y-2';
        row.innerHTML = `
          <div class="flex justify-between items-center">
            <div class="flex items-center gap-2">
              <span class="px-2 py-1 rounded-full bg-umgNavy text-white font-bold text-[11px] font-mono">${v.code}</span>
              <span class="text-sm font-bold text-slate-800">${v.name}</span>
              <span class="text-[11px] font-mono bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded font-bold">V: ${computeGrade(v.name)}</span>
            </div>
            <button onclick="removeVertex('${v.name}')" class="w-7 h-7 bg-rose-500 text-white rounded text-xs" title="Eliminar vértice"><i class="fa-solid fa-trash"></i></button>
          </div>
          <div class="space-y-1.5 pl-2">
            
            <div class="flex items-center gap-2 text-xs mb-2">
              <span class="text-indigo-600 font-bold text-[10px] uppercase">Conectar a:</span>
              <select id="select-conectar-${v.name}" class="flex-1 p-1 border border-indigo-300 rounded bg-indigo-50 font-semibold text-indigo-800 outline-none">
                <option value="">-- Elegir vértice --</option>
                ${disponibles.map(x => `<option value="${x.name}">${x.name} ${x.code}</option>`).join('')}
              </select>
              <button onclick="ejecutarConexion('${v.name}')" class="w-6 h-6 bg-indigo-600 text-white rounded hover:bg-indigo-700 transition">
                <i class="fa-solid fa-check"></i>
              </button>
            </div>

            ${conns.map(target => `
              <div class="flex items-center gap-2 text-xs">
                <span class="text-slate-500">↔</span>
                <span class="flex-1 p-1.5 border border-slate-300 rounded-lg bg-white">${target}</span>
                <button onclick="removeEdge('${v.name}', '${target}')" class="w-6 h-6 bg-slate-300 text-slate-700 rounded hover:bg-rose-200"><i class="fa-solid fa-xmark"></i></button>
              </div>
            `).join('')}
          </div>
        `;
        container.appendChild(row);
      });
      renderGraph();
    }

    function ejecutarConexion(nodoOrigen) {
      const select = document.getElementById(`select-conectar-${nodoOrigen}`);
      const nodoDestino = select.value;
      if (nodoDestino) addEdge(nodoOrigen, nodoDestino);
    }

    function renderGraph() {
      const container = document.getElementById('graph-canvas');
      const visNodes = vertices.map(v => ({
        id: v.name, label: `${v.code}\n${v.name}`,
        shape: 'circle', size: 26, color: { background: '#002B49', border: '#D4AF37' }, font: { color: '#ffffff' }
      }));
      const visEdges = edges.map((e, idx) => ({ id: `e_${idx}`, from: e.a, to: e.b, color: { color: '#94A3B8' } }));
      
      const data = { nodes: new vis.DataSet(visNodes), edges: new vis.DataSet(visEdges) };
      const options = { physics: { solver: 'forceAtlas2Based' }, interaction: { hover: true } };

      if (network) network.destroy();
      network = new vis.Network(container, data, options);
    }

    function limpiar() {
      if (isAnimating) return;
      const resDiv = document.getElementById('result-hamilton');
      resDiv.className = 'mt-4 text-xs p-3 rounded-lg border text-left font-sans leading-relaxed bg-slate-50 border-slate-200 text-slate-500';
      resDiv.innerHTML = '<i class="fa-solid fa-arrow-up mr-1"></i> Haz clic en un botón para iniciar el análisis del grafo.';
      
      if (network) {
        const edgeDataSet = network.body.data.edges;
        const nodeDataSet = network.body.data.nodes;
        edges.forEach((e, idx) => edgeDataSet.update({ id: `e_${idx}`, color: { color: '#94A3B8' }, width: 1 }));
        vertices.forEach(v => nodeDataSet.update({ id: v.name, color: { background: '#002B49', border: '#D4AF37' } }));
      }
    }

    function isConnected() {
      if (vertices.length === 0) return false;
      let visited = new Set(); let stack = [vertices[0].name];
      while (stack.length > 0) {
        let curr = stack.pop();
        if (!visited.has(curr)) {
          visited.add(curr);
          edges.forEach(e => {
            if (e.a === curr && !visited.has(e.b)) stack.push(e.b);
            if (e.b === curr && !visited.has(e.a)) stack.push(e.a);
          });
        }
      }
      return visited.size === vertices.length;
    }

    function findHamiltonian(nodes, adj) {
      let n = nodes.length;
      let result = { path: null, cycle: null, intentos: 0 };
      function solve(curr, visited, path) {
        result.intentos++;
        if (path.length === n) {
          if (!result.path) result.path = [...path];
          if (adj[curr].includes(path[0])) result.cycle = [...path, path[0]];
          return;
        }
        for (let neighbor of adj[curr]) {
          if (!visited[neighbor]) {
            visited[neighbor] = true;
            path.push(neighbor);
            solve(neighbor, visited, path);
            path.pop();
            visited[neighbor] = false;
            if (result.cycle) return;
          }
        }
      }
      for (let startNode of nodes) {
        let visited = { [startNode]: true };
        solve(startNode, visited, [startNode]);
        if (result.cycle) break;
      }
      return result;
    }

    async function animarRecorrido(path, colorHex) {
      isAnimating = true;
      const edgeDataSet = network.body.data.edges; const nodeDataSet = network.body.data.nodes;
      
      for (let i = 0; i < path.length; i++) {
        nodeDataSet.update({ id: path[i], color: { background: colorHex, border: '#ffffff' } });
        if (i < path.length - 1) {
          const a = path[i], b = path[i+1];
          const edgeIdx = edges.findIndex(e => (e.a === a && e.b === b) || (e.a === b && e.b === a));
          if (edgeIdx !== -1) edgeDataSet.update({ id: `e_${edgeIdx}`, color: { color: colorHex }, width: 4 });
        }
        await sleep(400);
      }
      isAnimating = false;
    }

    function mostrarResultado(html, exito) {
      const resDiv = document.getElementById('result-hamilton');
      resDiv.className = `text-xs p-3 mt-4 rounded-lg border text-left font-sans leading-relaxed ${exito ? 'bg-emerald-50 border-emerald-200 text-emerald-900' : 'bg-rose-50 border-rose-200 text-rose-900'}`;
      resDiv.innerHTML = html;
    }

    async function buscarCaminoHamilton() {
      if (isAnimating || vertices.length === 0) return;
      limpiar();
      
      if (vertices.length < 3) return mostrarResultado("<b>⚠️ Análisis Matemático:</b><br>El grafo tiene menos de 3 nodos. Un camino de Hamilton requiere al menos 3 nodos.", false);
      if (!isConnected()) return mostrarResultado("<b>⚠️ Análisis Matemático:</b><br>El grafo está <b>desconectado</b>. Es imposible recorrer todos los nodos en un solo trazo.", false);
      
      let grados1 = vertices.filter(v => computeGrade(v.name) === 1).length;
      if (grados1 > 2) return mostrarResultado(`<b>⚠️ Análisis Matemático:</b><br>Hay <b>${grados1} nodos con grado 1 (hojas)</b>. Un camino puede iniciar en una hoja y terminar en otra (máximo 2).`, false);

      let adj = {}; vertices.forEach(v => adj[v.name] = []);
      edges.forEach(e => { adj[e.a].push(e.b); adj[e.b].push(e.a); });

      const startTime = performance.now();
      let res = findHamiltonian(vertices.map(v => v.name), adj);
      const endTime = performance.now();
      const timeMs = (endTime - startTime).toFixed(2);
      
      if (res.path) {
        let esCiclo = res.cycle ? "<br><i class='text-emerald-600'>Nota: Como el último nodo conecta con el primero, también forma un Ciclo de Hamilton.</i>" : "";
        mostrarResultado(`<b>✅ Camino de Hamilton Encontrado</b><br><br>
          <span class="font-mono text-sm bg-white p-1 rounded border inline-block mb-2">${res.path.join(' → ')}</span><br>
          <b>Explicación:</b> El algoritmo de Backtracking logró visitar los ${vertices.length} nodos sin repetir ninguno. ${esCiclo}<br><br>
          <span class="text-[10px] text-slate-600"><b>⏱️ Tiempo:</b> ${timeMs} ms | <b>🔄 Intentos:</b> ${res.intentos}</span>`, true);
        await animarRecorrido(res.path, '#10B981');
      } else {
        mostrarResultado(`<b>❌ No existe Camino de Hamilton</b><br><br>
          <b>Análisis:</b> El algoritmo exploró todas las combinaciones posibles (${res.intentos} intentos) y no encontró ninguna ruta válida.<br><br>
          <span class="text-[10px] text-slate-600"><b>⏱️ Tiempo:</b> ${timeMs} ms | <b>🔄 Intentos:</b> ${res.intentos}</span>`, false);
      }
    }

    async function buscarCicloHamilton() {
      if (isAnimating || vertices.length === 0) return;
      limpiar();

      if (vertices.length < 3) return mostrarResultado("<b>⚠️ Análisis Matemático:</b><br>El grafo tiene menos de 3 nodos. No se puede formar un ciclo.", false);
      if (!isConnected()) return mostrarResultado("<b>⚠️ Análisis Matemático:</b><br>El grafo está <b>desconectado</b>. No puede haber Ciclo de Hamilton.", false);

      let grados1 = vertices.filter(v => computeGrade(v.name) === 1).length;
      if (grados1 > 0) return mostrarResultado(`<b>⚠️ Análisis Matemático:</b><br>El vértice <b>${vertices.find(v => computeGrade(v.name) === 1).name}</b> tiene grado 1 (es una hoja). Si entras a una hoja, no puedes regresar sin repetir nodo, por lo tanto, <b>es imposible cerrar un ciclo</b>.`, false);

      let adj = {}; vertices.forEach(v => adj[v.name] = []);
      edges.forEach(e => { adj[e.a].push(e.b); adj[e.b].push(e.a); });

      const startTime = performance.now();
      let res = findHamiltonian(vertices.map(v => v.name), adj);
      const endTime = performance.now();
      const timeMs = (endTime - startTime).toFixed(2);

      if (res.cycle) {
        mostrarResultado(`<b>✅ Ciclo de Hamilton Encontrado</b><br><br>
          <span class="font-mono text-sm bg-white p-1 rounded border inline-block mb-2">${res.cycle.join(' → ')}</span><br>
          <b>Explicación:</b> El recorrido visitó todos los nodos y logró regresar al punto de partida.<br><br>
          <span class="text-[10px] text-slate-600"><b>⏱️ Tiempo:</b> ${timeMs} ms | <b>🔄 Intentos:</b> ${res.intentos}</span>`, true);
        await animarRecorrido(res.cycle, '#0D9488');
      } else {
        mostrarResultado(`<b>❌ No existe Ciclo de Hamilton</b><br><br>
          <b>Análisis:</b> Aunque el grafo es conexo, no hay forma de visitar todos los nodos y volver al inicio sin repetir. <br><br>
          <span class="text-[10px] text-slate-600"><b>⏱️ Tiempo:</b> ${timeMs} ms | <b>🔄 Intentos:</b> ${res.intentos}</span>`, false);
      }
    }

    render(); // Iniciar
  </script>
</body>
</html>
