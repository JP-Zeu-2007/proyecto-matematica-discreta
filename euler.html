<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor Euler y Hamilton - UMG</title>
  
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <link rel="stylesheet" href="css/styles.css">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            umgNavy: '#002B49',
            umgGold: '#D4AF37',
            umgLightNavy: '#003A63',
            umgDarkNavy: '#001A2D',
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    
    .graph-container { 
      height: 520px; 
      width: 100%; 
      border-radius: 0.75rem; 
      border: 1px solid #E2E8F0; 
      background-color: #F8FAFC; 
      position: relative; 
      overflow: hidden; 
    }
    .graph-canvas-wrap { position: relative; width: 100%; height: 100%; }
    .tool-btn { padding: 6px 12px; font-size: 12px; border-radius: 6px; font-weight: 600; transition: all 0.2s; display: flex; align-items: center; gap: 6px; }
    
    #context-menu { display: none; position: absolute; z-index: 50; background: white; border: 1px solid #E2E8F0; border-radius: 0.5rem; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); padding: 4px; min-width: 150px; }
    #context-menu button { width: 100%; text-align: left; padding: 8px 12px; font-size: 12px; border-radius: 0.375rem; transition: background 0.2s; }
    #context-menu button:hover { background: #F1F5F9; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

  <header class="bg-umgNavy text-white shadow-xl border-b-4 border-umgGold sticky top-0 z-40">
    <div class="w-full flex flex-col sm:flex-row justify-between items-center px-4 py-2">
      <div class="flex items-center space-x-3">
        <div class="bg-white p-1 rounded-full">
          <img src="assets/logo-umg.png" alt="Logo UMG" class="w-10 h-10 object-contain">
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight">Editor de Grafos - Euler & Hamilton</h1>
          <p class="text-xs text-amber-300 font-medium">UMG - Matemática Discreta</p>
        </div>
      </div>
      <div class="flex gap-2 text-xs mt-2 sm:mt-0">
        <a href="index.html" class="px-4 py-2 bg-slate-700 text-white font-bold rounded-lg hover:bg-slate-600 transition shadow">
          <i class="fa-solid fa-house mr-1"></i> Menú Principal
        </a>
      </div>
    </div>
  </header>

  <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
    
    <section class="lg:col-span-8 space-y-4">
      
      <!-- BARRA DE HERRAMIENTAS -->
      <div class="bg-white rounded-2xl shadow-md border border-slate-200 p-3 flex flex-wrap gap-2 items-center">
        
        <button onclick="addVertexClick()" class="tool-btn bg-umgNavy text-white hover:bg-umgLightNavy" title="Añadir un nuevo vértice">
          <i class="fa-solid fa-plus"></i> + Vértice
        </button>
        
        <button onclick="toggleTijera()" id="btn-tijera" class="tool-btn bg-slate-200 text-slate-700 hover:bg-slate-300" title="Cortar aristas">
          <i class="fa-solid fa-scissors"></i> Tijera
        </button>
        
        <div class="h-6 w-px bg-slate-300 mx-1"></div>
        
        <label class="flex items-center gap-1 text-xs font-semibold cursor-pointer">
          <input type="checkbox" id="toggle-show-name" checked onchange="toggleVisibility('name')" class="rounded text-umgNavy focus:ring-umgNavy"> Nombre
        </label>
        <label class="flex items-center gap-1 text-xs font-semibold cursor-pointer">
          <input type="checkbox" id="toggle-show-id" checked onchange="toggleVisibility('id')" class="rounded text-umgNavy focus:ring-umgNavy"> ID
        </label>
        
        <div class="h-6 w-px bg-slate-300 mx-1"></div>
        
        <!-- BOTONES DE GESTIÓN -->
        <button onclick="crearNuevoGrafo()" class="tool-btn bg-orange-500 text-white hover:bg-orange-600" title="Crear un lienzo en blanco">
          <i class="fa-solid fa-file"></i> Nuevo
        </button>
        <button onclick="guardarGrafoActual()" class="tool-btn bg-blue-600 text-white hover:bg-blue-700" title="Guardar grafo actual">
          <i class="fa-solid fa-floppy-disk"></i> Guardar
        </button>
        <button onclick="toggleHistorial()" class="tool-btn bg-emerald-600 text-white hover:bg-emerald-700" title="Ver grafos guardados">
          <i class="fa-solid fa-folder-open"></i> Cargar
        </button>
        
        <button onclick="limpiarTodo()" class="tool-btn bg-rose-100 text-rose-700 hover:bg-rose-200 ml-auto">
          <i class="fa-solid fa-trash"></i> Limpiar
        </button>
      </div>

      <!-- LISTA DE HISTORIAL -->
      <div id="historial-panel" class="hidden bg-white rounded-2xl shadow-md border border-slate-200 p-4 transition-all">
        <h3 class="text-sm font-bold text-umgNavy mb-3"><i class="fa-solid fa-clock-rotate-left text-umgGold mr-1"></i> Grafos Guardados</h3>
        <div id="history-list" class="flex flex-wrap gap-2 max-h-32 overflow-y-auto custom-scrollbar">
          <!-- JS inyectará la lista aquí -->
        </div>
      </div>

      <!-- LIENZO VISUAL -->
      <div class="bg-white rounded-2xl shadow-md border border-slate-200 p-3">
        <div id="graph-container-wrap" class="graph-container">
          <div id="graph-canvas" class="graph-canvas-wrap"></div>
          
          <div id="context-menu">
            <button onclick="ctxRenombrar()" class="text-slate-700"><i class="fa-solid fa-pen mr-2 text-blue-500"></i> Renombrar</button>
            <button onclick="ctxEliminar()" class="text-rose-600"><i class="fa-solid fa-trash mr-2"></i> Eliminar</button>
            <button onclick="ctxEnlazar()" class="text-emerald-600"><i class="fa-solid fa-link mr-2"></i> Enlazar</button>
          </div>
        </div>
      </div>
    </section>

    <aside class="lg:col-span-4 space-y-4">
      
      <!-- MATRIZ Y GRADOS -->
      <div class="bg-white rounded-2xl shadow-md border border-slate-200 p-4 space-y-3">
        <h3 class="text-sm font-bold text-umgNavy border-b pb-2"><i class="fa-solid fa-table text-umgGold mr-1"></i> Matriz de Adyacencia</h3>
        
        <!-- CONTADORES -->
        <div class="bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs font-mono space-y-1">
          <p class="flex justify-between"><span class="text-slate-600">Orden (Vértices):</span> <span id="sum-order" class="font-bold text-umgNavy">0</span></p>
          <p class="flex justify-between"><span class="text-slate-600">Tamaño (Aristas):</span> <span id="sum-size" class="font-bold text-umgNavy">0</span></p>
          <p class="flex justify-between border-t border-dashed border-slate-300 pt-1 mt-1">
            <span class="text-slate-600 font-bold">Σ (Suma de Grados):</span> 
            <span id="sum-total" class="font-bold text-emerald-700">0</span>
          </p>
        </div>

        <div id="matriz-container" class="overflow-x-auto custom-scrollbar text-xs pb-2">
          <p class="text-slate-400 italic text-center">Agrega vértices para ver la matriz.</p>
        </div>
      </div>

      <!-- ANÁLISIS DE ALGORITMOS -->
      <div class="bg-white rounded-2xl shadow-md border border-slate-200 p-4 space-y-3">
        <div class="flex justify-between items-center border-b pb-2">
          <h3 class="text-sm font-bold text-umgNavy"><i class="fa-solid fa-microchip text-umgGold mr-1"></i> Análisis</h3>
          <button onclick="limpiarResultados()" class="text-xs text-slate-500 hover:text-rose-600" title="Limpiar animaciones"><i class="fa-solid fa-broom"></i> Limpiar</button>
        </div>

        <div class="space-y-2">
          <p class="text-[10px] font-bold text-indigo-600 uppercase tracking-wider">Euler</p>
          <button onclick="animarDFS()" id="btn-dfs" class="w-full py-2 bg-indigo-600 text-white font-bold text-xs rounded-lg shadow hover:bg-indigo-700 transition">1. Conexidad (DFS)</button>
          <div id="result-dfs" class="hidden text-xs p-2 rounded bg-slate-50 border text-center"></div>
          
          <button onclick="animarEulerCamino()" id="btn-camino" class="w-full py-2 bg-amber-500 text-white font-bold text-xs rounded-lg shadow hover:bg-amber-600 transition">2. Camino de Euler</button>
          <div id="result-camino" class="hidden text-xs p-2 rounded bg-slate-50 border text-center"></div>
          
          <button onclick="animarEulerCiclo()" id="btn-ciclo" class="w-full py-2 bg-purple-600 text-white font-bold text-xs rounded-lg shadow hover:bg-purple-700 transition">3. Ciclo de Euler</button>
          <div id="result-ciclo" class="hidden text-xs p-2 rounded bg-slate-50 border text-center"></div>
        </div>

        <div class="mt-4 pt-3 border-t-2 border-dashed border-slate-300 space-y-2">
          <p class="text-[10px] font-bold text-emerald-600 uppercase tracking-wider">Hamilton</p>
          <button onclick="buscarCaminoHamilton()" id="btn-hamilton-camino" class="w-full py-2 bg-emerald-500 text-white font-bold text-xs rounded-lg shadow hover:bg-emerald-600 transition">4. Camino de Hamilton</button>
          <button onclick="buscarCicloHamilton()" id="btn-hamilton-ciclo" class="w-full py-2 bg-teal-600 text-white font-bold text-xs rounded-lg shadow hover:bg-teal-700 transition">5. Ciclo de Hamilton</button>
          <div id="result-hamilton" class="hidden text-xs p-2 rounded bg-slate-50 border text-left font-sans leading-relaxed text-slate-700"></div>
        </div>
      </div>
    </aside>
  </main>

  <script src="js/validations.js"></script>
  <script src="js/graph.js"></script>
  <script src="js/euler.js"></script>
  <script src="js/hamilton.js"></script>
  <script src="js/main.js"></script>
  
  <script>
    function toggleHistorial() {
      const panel = document.getElementById('historial-panel');
      panel.classList.toggle('hidden');
      if (!panel.classList.contains('hidden')) {
        actualizarSelectHistorial();
      }
    }
  </script>
</body>
</html>
