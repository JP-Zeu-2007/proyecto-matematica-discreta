<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor Euler y Hamilton - UMG</title>
  
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <link rel="stylesheet" href="css/styles.css">
  
  <script>
    tailwind.config = { theme: { extend: { colors: { umgNavy: '#002B49', umgGold: '#D4AF37', umgLightNavy: '#003A63' } } } }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .graph-container { height: 520px; width: 100%; border-radius: 0.75rem; border: 1px solid #E2E8F0; background-color: #F8FAFC; position: relative; overflow: hidden; }
    .graph-canvas-wrap { position: relative; width: 100%; height: 100%; }
    .context-menu { display: none; position: absolute; z-index: 50; background: white; border: 1px solid #E2E8F0; border-radius: 0.5rem; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); padding: 4px; min-width: 150px; }
    .context-menu button { width: 100%; text-align: left; padding: 8px 12px; font-size: 12px; border-radius: 0.375rem; transition: background 0.2s; }
    .context-menu button:hover { background: #F1F5F9; }
    
    /* Estilos de la Matriz */
    .matrix-table { border-collapse: collapse; width: 100%; font-size: 10px; text-align: center; }
    .matrix-table th, .matrix-table td { border: 1px solid #CBD5E1; padding: 4px; }
    .matrix-table th { background-color: #F1F5F9; font-weight: bold; color: #002B49; }
    .matrix-table td { background-color: #ffffff; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

  <header class="bg-umgNavy text-white shadow-xl border-b-4 border-umgGold sticky top-0 z-40">
    <div class="w-full flex flex-col sm:flex-row justify-between items-center px-4 py-2">
      <div class="flex items-center space-x-3">
        <div class="bg-white p-1 rounded-full">
          <img src="assets/logo-umg.png" alt="Logo UMG" class="w-10 h-10 object-contain">
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight">Editor Euler & Hamilton</h1>
        </div>
      </div>
      <div class="flex gap-2 text-xs mt-2 sm:mt-0">
        <a href="index.html" class="px-4 py-2 bg-slate-700 text-white font-bold rounded-lg hover:bg-slate-600 transition shadow"><i class="fa-solid fa-house mr-1"></i> Menú Principal</a>
      </div>
    </div>
  </header>

  <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
    
    <section class="lg:col-span-8 space-y-4">
      
      <!-- BARRA DE HERRAMIENTAS -->
      <div class="bg-white rounded-2xl shadow-md border border-slate-200 p-3 flex flex-wrap gap-2 items-center">
        <div class="flex items-center bg-indigo-600 rounded-lg overflow-hidden border border-indigo-700">
          <span class="px-2 py-2 text-white text-xs font-bold"><i class="fa-solid fa-person-walking"></i> Avatar:</span>
          <select id="viajero-select" class="bg-indigo-600 text-white text-xs px-2 py-2 outline-none cursor-pointer">
            <option value="user">👤 Persona</option>
            <option value="car">🚗 Carro</option>
            <option value="plane">✈️ Avión</option>
          </select>
        </div>

        <div class="flex items-center bg-umgNavy rounded-lg overflow-hidden border border-umgNavy">
          <button onclick="addVertexClick()" class="px-3 py-2 text-white font-bold text-xs hover:bg-umgLightNavy border-r border-slate-500"><i class="fa-solid fa-plus"></i> Vértice</button>
          <select id="vertex-icon-select" class="bg-umgNavy text-white text-xs px-2 py-2 outline-none cursor-pointer">
            <option value="circle">🔵 Círculo</option>
            <option value="plane">✈️ Avión</option>
            <option value="server">💻 Servidor</option>
            <option value="building">🏢 Edificio</option>
            <option value="house">🏠 Casa</option>
            <option value="star">⭐ Estrella</option>
          </select>
        </div>

        <label class="flex items-center gap-1 text-xs font-semibold cursor-pointer bg-slate-100 px-2 py-2 rounded-lg">
          <input type="checkbox" id="toggle-directed" onchange="onToggleDirected()" class="rounded text-umgNavy"> Aristas Dirigidas
        </label>

        <button onclick="toggleTijera()" id="btn-tijera" class="px-3 py-2 bg-slate-200 text-slate-700 font-bold text-xs rounded-lg hover:bg-rose-200 transition" title="Eliminar aristas haciendo clic en ellas">
          <i class="fa-solid fa-scissors"></i> Tijera
        </button>

        <select onchange="cargarEjemplo(this.value); this.value='';" class="text-xs p-2 bg-slate-200 rounded-lg font-bold text-slate-700 outline-none">
          <option value="">-- Cargar Ejemplo --</option>
          <option value="vuelos">✈️ Rutas de Vuelo</option>
          <option value="servidores">💻 Red de Servidores</option>
          <option value="ciudades">🏢 Red de Ciudades</option>
          <option value="tuberias">💧 Red de Tuberías</option>
          <option value="estrella">⭐ Grafo Estrella</option>
        </select>

        <button onclick="guardarGrafoActual()" class="px-3 py-2 bg-blue-600 text-white text-xs font-bold rounded-lg hover:bg-blue-700"><i class="fa-solid fa-floppy-disk"></i> Guardar</button>
        <button onclick="toggleHistorial()" class="px-3 py-2 bg-emerald-600 text-white text-xs font-bold rounded-lg hover:bg-emerald-700"><i class="fa-solid fa-folder-open"></i> Cargar</button>
        <button onclick="crearNuevoGrafo()" class="px-3 py-2 bg-rose-100 text-rose-700 text-xs font-bold rounded-lg hover:bg-rose-200 ml-auto"><i class="fa-solid fa-broom"></i> Limpiar</button>
      </div>

      <!-- LISTA DE HISTORIAL -->
      <div id="historial-panel" class="hidden bg-white rounded-2xl shadow-md border border-slate-200 p-4">
        <h3 class="text-sm font-bold text-umgNavy mb-3"><i class="fa-solid fa-clock-rotate-left text-umgGold mr-1"></i> Grafos Guardados</h3>
        <div id="history-list" class="flex flex-wrap gap-2 max-h-32 overflow-y-auto custom-scrollbar"></div>
      </div>

      <!-- LIENZO VISUAL -->
      <div class="bg-white rounded-2xl shadow-md border border-slate-200 p-3">
        <div id="graph-container-wrap" class="graph-container">
          <div id="graph-canvas" class="graph-canvas-wrap"></div>
          <div id="context-menu" class="context-menu">
            <button onclick="ctxRenombrar()" class="text-slate-700"><i class="fa-solid fa-pen mr-2 text-blue-500"></i> Renombrar</button>
            <button onclick="ctxEnlazar()" class="text-emerald-600"><i class="fa-solid fa-link mr-2"></i> Enlazar</button>
            <button onclick="ctxEliminar()" class="text-rose-600"><i class="fa-solid fa-trash mr-2"></i> Eliminar</button>
          </div>
        </div>
      </div>
    </section>

    <!-- PANEL DERECHO -->
    <aside class="lg:col-span-4 space-y-4">
      
      <!-- RESUMEN Y MATRIZ -->
      <div class="bg-white rounded-2xl shadow-md border border-slate-200 p-4 space-y-3">
        <h3 class="text-sm font-bold text-umgNavy border-b pb-2"><i class="fa-solid fa-table text-umgGold mr-1"></i> Resumen y Matriz</h3>
        
        <div class="bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs font-mono space-y-1">
          <p class="flex justify-between"><span>Orden (Vértices):</span> <span id="sum-order" class="font-bold text-umgNavy">0</span></p>
          <p class="flex justify-between"><span>Tamaño (Aristas):</span> <span id="sum-size" class="font-bold text-umgNavy">0</span></p>
          <p class="flex justify-between border-t pt-1 mt-1"><span>Σ (Suma Grados):</span> <span id="sum-total" class="font-bold text-emerald-700">0</span></p>
        </div>

        <!-- MATRIZ DE ADYACENCIA -->
        <div id="matriz-container" class="overflow-x-auto custom-scrollbar pb-2">
          <p class="text-xs text-slate-400 italic text-center">Agrega vértices para ver la matriz.</p>
        </div>
      </div>

      <!-- ANÁLISIS (BOTONES Y RESULTADOS INDIVIDUALES) -->
      <div class="bg-white rounded-2xl shadow-md border border-slate-200 p-4 space-y-3">
        <div class="flex justify-between items-center border-b pb-2">
          <h3 class="text-sm font-bold text-umgNavy"><i class="fa-solid fa-microchip text-umgGold mr-1"></i> Análisis</h3>
          <button onclick="limpiarAnalisis()" class="text-xs text-slate-500 hover:text-rose-600"><i class="fa-solid fa-broom"></i> Limpiar</button>
        </div>
        
        <div class="space-y-2">
          <p class="text-[10px] font-bold text-indigo-600 uppercase">Euler</p>
          
          <button onclick="animarDFS()" id="btn-dfs" class="w-full py-2 bg-indigo-600 text-white font-bold text-xs rounded-lg shadow hover:bg-indigo-700 transition">1. Conexidad (DFS)</button>
          <div id="result-dfs" class="hidden text-xs p-2 rounded bg-slate-50 border text-center mb-2"></div>
          
          <button onclick="animarEulerCamino()" id="btn-camino" class="w-full py-2 bg-amber-500 text-white font-bold text-xs rounded-lg shadow hover:bg-amber-600 transition">2. Camino de Euler</button>
          <div id="result-camino" class="hidden text-xs p-2 rounded bg-slate-50 border text-center mb-2"></div>
          
          <button onclick="animarEulerCiclo()" id="btn-ciclo" class="w-full py-2 bg-purple-600 text-white font-bold text-xs rounded-lg shadow hover:bg-purple-700 transition">3. Ciclo de Euler</button>
          <div id="result-ciclo" class="hidden text-xs p-2 rounded bg-slate-50 border text-center mb-2"></div>
        </div>

        <div class="mt-4 pt-3 border-t-2 border-dashed border-slate-300 space-y-2">
          <p class="text-[10px] font-bold text-emerald-600 uppercase">Hamilton</p>
          
          <button onclick="buscarCaminoHamilton()" id="btn-hamilton-camino" class="w-full py-2 bg-emerald-500 text-white font-bold text-xs rounded-lg shadow hover:bg-emerald-600 transition">4. Camino de Hamilton</button>
          <div id="result-hamilton-camino" class="hidden text-xs p-2 rounded bg-slate-50 border text-center mb-2"></div>
          
          <button onclick="buscarCicloHamilton()" id="btn-hamilton-ciclo" class="w-full py-2 bg-teal-600 text-white font-bold text-xs rounded-lg shadow hover:bg-teal-700 transition">5. Ciclo de Hamilton</button>
          <div id="result-hamilton-ciclo" class="hidden text-xs p-2 rounded bg-slate-50 border text-center"></div>
        </div>
      </div>
    </aside>
  </main>

  <script src="js/validations.js"></script>
  <script src="js/graph.js"></script>
  <script src="js/euler.js"></script>
  <script src="js/hamilton.js"></script>
  <script src="js/main.js"></script>
  <script>
    function toggleHistorial() {
      document.getElementById('historial-panel').classList.toggle('hidden');
      if (!document.getElementById('historial-panel').classList.contains('hidden')) actualizarSelectHistorial();
    }
  </script>
</body>
</html>
